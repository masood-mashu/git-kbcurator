spec_version: "0.1.0"
name: git-kbcurator
version: 1.0.0
description: "Autonomous Support Ticket Resolution Summarizer & Knowledge Base Runbook Synthesizer"
author: "masood-mashu"
license: "Apache-2.0"

model:
  preferred: "openai:gpt-4o"
  fallback:
    - "anthropic:claude-3-5-sonnet"
    - "openai:gpt-4o-mini"
  constraints:
    temperature: 0.1
    max_tokens: 4096

skills:
  - technical-documentation-standards
  - knowledge-graph-deduplication

tools:
  - resolution-summarizer
  - runbook-markdown-formatter
  - duplicate-article-detector

runtime:
  max_turns: 50
  timeout: 120

tags:
  - customer-support
  - knowledge-base
  - runbook-synthesis
  - technical-documentation
  - passport-challenge

metadata:
  passport_id: "aps-kbcurator-01"
  passport_category: "Customer support"
