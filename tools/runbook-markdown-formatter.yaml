name: runbook-markdown-formatter
version: 1.0.0
description: "Formats troubleshooting guide into standard Markdown with code blocks"
input_schema:
  type: object
  properties:
    steps_json:
      type: string
      description: "JSON with title and steps list"
  required:
    - steps_json
implementation:
  type: script
  path: runbook_markdown_formatter.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
