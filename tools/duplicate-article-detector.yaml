name: duplicate-article-detector
version: 1.0.0
description: "Calculates semantic cosine similarity against published knowledge base articles"
input_schema:
  type: object
  properties:
    similarity_check_json:
      type: string
      description: "JSON with candidate_title and existing_titles list"
  required:
    - similarity_check_json
implementation:
  type: script
  path: duplicate_article_detector.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
